version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finmodel-backend
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/financial_model.db
      - UPLOAD_DIR=/app/uploads
      - DEBUG=false
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:80","http://frontend"]
      # Optional: set your API keys for enhanced NLP
      # - OPENAI_API_KEY=your_key_here
      # - ANTHROPIC_API_KEY=your_key_here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finmodel-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
